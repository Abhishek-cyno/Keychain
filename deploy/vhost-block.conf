  # ---- Eqova keychain app BEGIN (managed by deploy/install-routing.sh) ----
  # Hands /d/<id> and /admin to the React SPA before WordPress's catch-all
  # (RewriteCond !-f / !-d -> /index.php) can claim them. Without this,
  # eqova.in/d/1 is guessed into /demo-page/ by WordPress.
  #
  # Vhost-level rules run during URL translation, ahead of the per-directory
  # WordPress rules below, so these win. RewriteEngine is already On above.
  #
  # The app's own JS/CSS under /keychain-app/assets/ are real files, so
  # WordPress's !-f condition already lets them through untouched.
  # The code is an alphanumeric slug, not a number: /d/k7mq2xdv9p, never /d/1.
  RewriteRule ^/d/[A-Za-z0-9]{4,32}/?$ /keychain-app/index.html [L]
  RewriteRule ^/admin/?$ /keychain-app/index.html [L]
  RewriteRule ^/admin/keychain/[0-9]+/?$ /keychain-app/index.html [L]

  <Directory "/opt/bitnami/wordpress/keychain-app">
    Require all granted
    Options -Indexes
    <IfModule mod_headers.c>
      # Vite fingerprints asset filenames, so they are safe to cache hard.
      <FilesMatch "\.(js|css|svg|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
      </FilesMatch>
      # The SPA shell must not be cached, or a deploy never reaches a phone
      # that already opened a profile.
      <Files "index.html">
        Header set Cache-Control "no-store, must-revalidate"
      </Files>
    </IfModule>
  </Directory>
  # ---- Eqova keychain app END ----
