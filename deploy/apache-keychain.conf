# Eqova keychain app — Apache vhost snippet for Bitnami WordPress on Lightsail.
#
# Confirmed needed on this server: AllowOverride is None, so .htaccess is
# ignored and the rules must live in the vhost.
#
# WHERE THIS GOES
#   sudo nano /opt/bitnami/apache/conf/vhosts/wordpress-https-vhost.conf
#
# Paste the block below INSIDE <VirtualHost ... :443>, immediately after the
# DocumentRoot line and BEFORE any
#   Include ".../wordpress-htaccess.conf"
# line. That Include is where Bitnami keeps WordPress's own rewrite rules —
# the ones that would otherwise send /d/<code> to a WordPress permalink guess.
#
# Then, and only then:
#   sudo apachectl configtest && sudo /opt/bitnami/ctlscript.sh restart apache
#
# Do the same in wordpress-vhost.conf (port 80) only if you serve plain HTTP;
# on this site port 80 already redirects to HTTPS, so it is not needed.
#
# NO Alias is required. The build is uploaded to
#   /opt/bitnami/wordpress/keychain-app
# which is inside DocumentRoot, so /keychain-app/assets/... already resolves to
# real files on disk. WordPress's catch-all only claims paths that are NOT real
# files, so the app's JS and CSS pass through untouched.

  # ---- Eqova keychain app — BEGIN ----
  <IfModule mod_rewrite.c>
      RewriteEngine On

      # Public profile — what every NFC chip and QR code points at.
      # The address bar keeps showing /d/<code>; only the file served changes.
      RewriteRule ^/d/[A-Za-z0-9]{4,32}/?$ /keychain-app/index.html [L]

      # Staff admin, and the assign/edit screen beneath it.
      RewriteRule ^/admin/?$ /keychain-app/index.html [L]
      RewriteRule ^/admin/keychain/[0-9]+/?$ /keychain-app/index.html [L]
  </IfModule>

  <Directory "/opt/bitnami/wordpress/keychain-app">
      Require all granted
      Options -Indexes

      <IfModule mod_headers.c>
          # Vite fingerprints these filenames, so they can be cached hard.
          <FilesMatch "\.(js|css|svg|woff2?)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
          </FilesMatch>

          # The SPA shell must never be cached, or a deploy will not reach
          # phones that have already visited a profile.
          <Files "index.html">
              Header set Cache-Control "no-store, must-revalidate"
          </Files>
      </IfModule>
  </Directory>
  # ---- Eqova keychain app — END ----
