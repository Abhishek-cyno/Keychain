# Eqova — Nginx site config for AWS Lightsail.
#
# The whole point of this file is the SPA fallback: a phone that taps an NFC
# keychain requests https://eqova.in/d/127 directly, with no client-side router
# involved yet. There is no /d/127 file on disk, so without try_files Nginx
# returns a hard 404 and the profile never loads. One dynamic route, 500
# keychains, zero per-ID server config.
#
# Install:
#   sudo cp nginx-eqova.conf /etc/nginx/sites-available/eqova
#   sudo ln -sf /etc/nginx/sites-available/eqova /etc/nginx/sites-enabled/eqova
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate:
#   sudo certbot --nginx -d eqova.in -d www.eqova.in

server {
    listen 80;
    listen [::]:80;
    server_name eqova.in www.eqova.in;

    # Certbot rewrites this block to redirect to HTTPS once the cert is issued.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://eqova.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eqova.in;

    # Filled in by certbot --nginx
    # ssl_certificate     /etc/letsencrypt/live/eqova.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eqova.in/privkey.pem;

    root /var/www/eqova;
    index index.html;

    # Vite fingerprints these filenames, so they can be cached hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Every /d/:id and /admin path falls through to the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Profiles are public and get shared, so allow them to be embedded/previewed
    # while keeping the usual hardening.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 12M;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eqova.in;
    return 301 https://eqova.in$request_uri;
}
