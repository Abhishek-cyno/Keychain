name: Build and deploy

# Pull requests build only. Pushes to main build and then deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never let two deploys interleave on the same server. Queue instead of
# cancelling: a half-finished rsync into a live web root is worse than waiting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          # Read as _RAW and stripped below. Values pasted into the GitHub UI
          # routinely carry a trailing newline, which would otherwise be baked
          # into the bundle as part of the URL.
          VITE_API_BASE_RAW: ${{ vars.VITE_API_BASE }}
          VITE_PUBLIC_ORIGIN_RAW: ${{ vars.VITE_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          # URLs contain no whitespace, so deleting all of it is safe here.
          export VITE_API_BASE="$(printf '%s' "${VITE_API_BASE_RAW:-}" | tr -d '[:space:]')"
          export VITE_PUBLIC_ORIGIN="$(printf '%s' "${VITE_PUBLIC_ORIGIN_RAW:-}" | tr -d '[:space:]')"
          echo "VITE_API_BASE      = [${VITE_API_BASE}]"
          echo "VITE_PUBLIC_ORIGIN = [${VITE_PUBLIC_ORIGIN}]"
          npm run build

      # Each of these ships a broken site that still returns HTTP 200.
      - name: Verify the bundle is deployable
        working-directory: web
        run: |
          set -euo pipefail

          # Without .htaccess every /<code> URL 404s, because none of them
          # exist on disk.
          if [ ! -f dist/.htaccess ]; then
            echo "::error::dist/.htaccess is missing. It should be copied from web/public/."
            exit 1
          fi

          # Wrong Vite base -> assets 404 -> blank white page.
          if ! grep -q 'src="/assets/' dist/index.html; then
            echo "::error::index.html does not reference /assets/. Check the Vite base."
            exit 1
          fi

          # Missing VITE_API_BASE -> USING_MOCK stays true -> the live site
          # would serve seeded demo data to real people.
          if ! grep -rq 'script.google.com' dist/assets/; then
            echo "::error::No Apps Script URL in the bundle. Set the VITE_API_BASE repository variable, or this deploys in mock mode."
            exit 1
          fi

          echo "Bundle looks deployable:"
          ls -la dist dist/assets

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          include-hidden-files: true   # .htaccess
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to DreamHost
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Optional but recommended: add a required reviewer to this environment in
    # repo Settings -> Environments -> production, and deploys pause for
    # approval instead of going straight to the live site.
    environment:
      name: production
      url: https://tap.eqova.in/admin

    steps:
      # Report what actually reached the job before anything tries to use it.
      # Lengths only: a secret's size is not sensitive, its content is.
      - name: Preflight — are the inputs present?
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          missing=0

          report() {
            len=${#2}
            if [ "$len" -eq 0 ]; then
              printf '  %-18s MISSING (%s)\n' "$1" "$3"
              missing=1
            else
              printf '  %-18s present, %s chars\n' "$1" "$len"
            fi
          }

          echo "Secrets (Settings -> Secrets and variables -> Actions -> Secrets tab):"
          report DEPLOY_SSH_KEY  "${DEPLOY_SSH_KEY:-}"  "required"
          report DEPLOY_HOST_KEY "${DEPLOY_HOST_KEY:-}" "optional"
          echo "Variables (same page, Variables tab):"
          report DEPLOY_HOST     "${DEPLOY_HOST:-}"     "required"
          report DEPLOY_USER     "${DEPLOY_USER:-}"     "required"
          report DEPLOY_PATH     "${DEPLOY_PATH:-}"     "required"

          if [ "$missing" -ne 0 ]; then
            echo
            echo "::error::A required input is empty. A secret and a variable are different tabs on the same page — a value saved on the Variables tab is NOT readable via secrets.*, and vice versa. Check the name matches exactly, with no trailing space."
            exit 1
          fi
          echo "All required inputs present."

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Set up SSH
        env:
          # Key material keeps its newlines — only the scalar host is trimmed.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_RAW: ${{ vars.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          DEPLOY_HOST="$(printf '%s' "${DEPLOY_HOST_RAW:-}" | tr -d '[:space:]')"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # A key pasted from Windows arrives with CRLF line endings, and
          # OpenSSH rejects those with a bare "error in libcrypto" at connect
          # time. Strip the CRs and guarantee the trailing newline PEM needs.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Validate here rather than letting rsync fail cryptically later.
          # The fingerprint is safe to log; the key itself never is.
          if ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo -n "Deploy key OK: "
            ssh-keygen -lf ~/.ssh/deploy_key
          else
            echo "::error::DEPLOY_SSH_KEY is not a valid private key."
            first="$(head -1 ~/.ssh/deploy_key)"
            case "$first" in
              -----BEGIN*)
                echo "Header looks right ($first) but the body is malformed."
                echo "Lines in secret: $(wc -l < ~/.ssh/deploy_key). An ed25519 key has 7."
                echo "Usual cause: line breaks lost when pasting. Re-copy the file verbatim."
                ;;
              ssh-*)
                echo "This is a PUBLIC key. Paste the private one (no .pub extension)."
                ;;
              *)
                echo "Does not start with a BEGIN header at all - the secret may be empty or truncated."
                ;;
            esac
            exit 1
          fi

          if [ -n "${DEPLOY_HOST_KEY:-}" ]; then
            # Pinned host key: immune to a man-in-the-middle on first contact.
            printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_HOST_KEY not set; trusting whatever answers on first connect."
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Ship to DreamHost
        env:
          DEPLOY_HOST_RAW: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER_RAW: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH_RAW: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          # A value pasted into the GitHub UI often keeps a trailing newline.
          # Unstripped, "user\n@host\n" makes ssh reject the username outright.
          trim() { printf '%s' "${1:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          DEPLOY_HOST="$(trim "$DEPLOY_HOST_RAW")"
          DEPLOY_USER="$(trim "$DEPLOY_USER_RAW")"
          DEPLOY_PATH="$(trim "$DEPLOY_PATH_RAW")"

          echo "Deploying to [$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH]"

          # --delete clears the previous build's fingerprinted assets, which
          # would otherwise accumulate indefinitely. The web root holds nothing
          # but the build; DreamHost keeps logs outside it.
          rsync -az --delete --itemize-changes \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Verify the live site
        env:
          ORIGIN_RAW: ${{ vars.VITE_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          ORIGIN="$(printf '%s' "${ORIGIN_RAW:-https://tap.eqova.in}" | tr -d '[:space:]')"
          fail=0

          check() {
            code=$(curl -s -o /dev/null -L -m 30 -w '%{http_code}' "$1" || echo 000)
            printf '  %-46s -> %s\n' "$1" "$code"
            [ "$code" = "200" ] || fail=1
          }

          # A well-formed but deliberately fake code. Keychain codes are random
          # and secret, so CI cannot hold a real one — and it does not need to.
          # A 200 proves the .htaccess SPA fallback is serving the app; the app
          # answering "not recognised" is the correct result for a fake code.
          check "$ORIGIN/zzzzzzzzzz"
          check "$ORIGIN/admin"
          check "$ORIGIN/"

          # The asset the page actually loads — catches a half-copied bundle.
          asset=$(curl -s -L -m 30 "$ORIGIN/zzzzzzzzzz" | grep -o '/assets/[^"]*\.js' | head -1)
          if [ -z "$asset" ]; then
            echo "::error::Served HTML has no /assets/ reference."
            exit 1
          fi
          check "$ORIGIN$asset"

          [ "$fail" = "0" ] || { echo "::error::Post-deploy verification failed."; exit 1; }
          echo "Live and serving."
